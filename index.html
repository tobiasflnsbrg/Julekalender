<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julen med Dig ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;

    font-family:Georgia, serif;

    background:
    radial-gradient(circle at top,
    #c62828 0%,
    #8b0000 50%,
    #3e0000 100%);

    color:white;
}

.header{
    text-align:center;
    margin-bottom:40px;
}

.header h1{
    color:#ffe082;
    font-size:3rem;
    margin-bottom:10px;
}

.header p{
    font-size:1.2rem;
}

.calendar{

    max-width:1000px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:15px;
}

.door{

    min-height:120px;

    text-decoration:none;

    border-radius:20px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    transition:.3s;

    border:2px solid rgba(255,215,0,.3);
}

.door:hover{

    transform:translateY(-5px);
}

.unlocked{

    background:
    linear-gradient(
    145deg,
    #d32f2f,
    #b71c1c
    );

    color:white;

    cursor:pointer;
}

.locked{

    background:
    rgba(255,255,255,.08);

    color:#ccc;

    opacity:.65;

    cursor:not-allowed;
}

.day{
    font-size:2rem;
    font-weight:bold;
}

.icon{
    margin-top:8px;
    font-size:1.5rem;
}

.footer{

    margin-top:40px;

    text-align:center;

    color:#ffe082;
}

.hero{

    text-align:center;

    max-width:900px;

    margin:0 auto 40px auto;

    padding:30px;

    border-radius:30px;

    background:
    rgba(255,255,255,.08);

    border:2px solid
    rgba(255,215,0,.2);
}

</style>

</head>

<body>

<div class="header">

<h1>🎄 Julen med Dig ❤️</h1>

<p>
24 små påmindelser om,
hvor meget du betyder for mig
</p>

</div>

<div class="hero">

<h2>Til min elskede ❤️</h2>

<p>
Bag hver låge gemmer der sig
et minde, en kærlig tanke
eller en lille overraskelse.
</p>

</div>

<div id="calendar" class="calendar"></div>

<div class="footer">

❤️ Tobias ❤️

</div>

<script>

// Dansk dato
const copenhagenDate = new Date(
    new Date().toLocaleString(
        "en-US",
        {
            timeZone: "Europe/Copenhagen"
        }
    )
);

const currentMonth =
    copenhagenDate.getMonth() + 1;

const currentDay =
    copenhagenDate.getDate();

const calendar =
    document.getElementById("calendar");

for(let day = 1; day <= 24; day++){

    const door = document.createElement("a");

    const unlocked =
        currentMonth === 12 &&
        currentDay >= day;

    if(unlocked){

        door.href = `day${day}.html`;

        door.className =
            "door unlocked";

        door.innerHTML = `
            <div class="day">
                ${day}
            </div>

            <div class="icon">
                🎁
            </div>
        `;

    }
    else{

        door.href = "#";

        door.className =
            "door locked";

        door.onclick = function(e){

            e.preventDefault();

            alert(
                "Denne låge åbner først den "
                + day +
                ". december ❤️"
            );

        };

        door.innerHTML = `
            <div class="day">
                ${day}
            </div>

            <div class="icon">
                🔒
            </div>
        `;
    }

    calendar.appendChild(door);
}

</script>
    
</body>
</html>
