<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julen med Dig ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:
        radial-gradient(circle at top,
        #c62828 0%,
        #8b0000 40%,
        #3e0000 100%);
    color:white;
}

.header{
    text-align:center;
    padding:50px 20px 30px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
    color:#ffe082;
    text-shadow:0 0 15px rgba(255,215,0,.5);
}

.subtitle{
    font-size:1.2rem;
    color:#fff8e1;
}

.hero{
    max-width:900px;
    margin:auto;
    padding:0 20px 40px;
    text-align:center;
}

.hero-card{
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,215,0,.3);
    border-radius:30px;
    padding:30px;
    backdrop-filter:blur(10px);
}

.calendar{

    max-width:1000px;
    margin:40px auto;

    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(120px,1fr));

    gap:15px;

    padding:20px;
}

.door{

    background:
        linear-gradient(
            145deg,
            #d32f2f,
            #b71c1c
        );

    border:2px solid rgba(255,215,0,.3);

    border-radius:20px;

    min-height:120px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    color:white;

    transition:.3s;
}

.door:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

.day{
    font-size:2rem;
    font-weight:bold;
}

.icon{
    margin-top:8px;
    font-size:1.5rem;
}

.locked{
    opacity:.55;
    cursor:not-allowed;
}

.footer{
    text-align:center;
    padding:25px;
    color:#ffe082;
}

.snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.20;
    background-image:
      radial-gradient(white 2px, transparent 2px);
    background-size:120px 120px;
}

</style>
</head>
<body>

<div class="snow"></div>

<div class="header">
    <h1>🎄 Julen med Dig ❤️</h1>

    <div class="subtitle">
        24 små påmindelser om,
        hvorfor jeg elsker dig
    </div>
</div>

<div class="hero">

    <div class="hero-card">

        <h2>Til min elskede ❤️</h2>

        <p>
            Hver dag gemmer der sig en lille besked,
            et minde, et smil eller en overraskelse.
        </p>

        <p>
            Jeg håber denne kalender minder dig om,
            hvor meget du betyder for mig.
        </p>

        <p>
            Glædelig december 🎄
        </p>

    </div>

</div>

<div class="calendar" id="calendar"></div>

<div class="footer">
    ❤️ Tobias ❤️
</div>

<script>

// DANSK TID

const today = new Intl.DateTimeFormat(
    'en-CA',
    {
        timeZone:'Europe/Copenhagen',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
    }
).format(new Date());

const currentDay =
parseInt(today.split('-')[2]);

const calendar =
document.getElementById('calendar');

for(let day=1; day<=24; day++){

    const isOpen = currentDay >= day;

    let door = document.createElement('a');

    if(isOpen){

        door.href = `day${day}.html`;

        door.className = 'door';

        door.innerHTML = `
            <div class="day">
                ${day}
            </div>

            <div class="icon">
                🎁
            </div>
        `;

    }else{

        door.href = '#';

        door.className =
            'door locked';

        door.onclick = function(e){

            e.preventDefault();

            alert(
              'Denne låge åbner først den '
              + day +
              '. december ❤️'
            );

        };

        door.innerHTML = `
            <div class="day">
                ${day}
            </div>

            <div class="icon">
                🔒
            </div>
        `;
    }

    calendar.appendChild(door);
}

</script>

</body>
</html>
