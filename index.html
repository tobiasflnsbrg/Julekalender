<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julen med Dig ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    min-height:100vh;

    font-family:Georgia, serif;
    color:white;

    background:
    radial-gradient(
        circle at top,
        #c62828 0%,
        #790000 50%,
        #250000 100%
    );
}

.snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.snowflake{
    position:absolute;
    top:-30px;
    color:white;
    opacity:.7;
    animation:fall linear infinite;
}

.snowflake:nth-child(1){left:5%;font-size:20px;animation-duration:10s;}
.snowflake:nth-child(2){left:18%;font-size:14px;animation-duration:12s;}
.snowflake:nth-child(3){left:32%;font-size:24px;animation-duration:13s;}
.snowflake:nth-child(4){left:48%;font-size:18px;animation-duration:9s;}
.snowflake:nth-child(5){left:62%;font-size:22px;animation-duration:14s;}
.snowflake:nth-child(6){left:78%;font-size:16px;animation-duration:11s;}
.snowflake:nth-child(7){left:92%;font-size:25px;animation-duration:12s;}

@keyframes fall{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(110vh);
    }
}

.content{
    position:relative;
    z-index:1;
    max-width:1000px;
    margin:auto;
}

.test-banner{
    background:#ffeb3b;
    color:black;
    padding:12px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    color:#ffe082;
    font-size:clamp(2rem,6vw,3.5rem);
}

.header p{
    font-size:1.1rem;
    line-height:1.5;
}

.hero{
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,215,0,.25);
    border-radius:25px;
    padding:20px;
    text-align:center;
    margin-bottom:25px;
}

.hero h2{
    color:#ffe082;
    margin-top:0;
}

.countdown{
    color:#ffe082;
    font-weight:bold;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.door{
    min-height:110px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    color:white;

    background:
    linear-gradient(
        145deg,
        #e53935,
        #a50000
    );

    border-radius:20px;
    border:2px solid rgba(255,215,0,.3);

    transition:.2s;

    box-shadow:
    0 5px 15px rgba(0,0,0,.25);

    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.door:hover{
    transform:translateY(-3px);
}

.day{
    font-size:2rem;
    font-weight:bold;
}

.icon{
    margin-top:8px;
    font-size:1.4rem;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#ffe082;
    line-height:1.8;
}

/* Tablet */

@media(max-width:768px){

    .calendar{
        grid-template-columns:repeat(3,1fr);
    }

    .door{
        min-height:95px;
    }

    .day{
        font-size:1.7rem;
    }
}

/* Mobil */

@media(max-width:480px){

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

    .door{
        min-height:90px;
    }

    .day{
        font-size:1.5rem;
    }

    .icon{
        font-size:1.2rem;
    }

    .hero{
        padding:15px;
    }

    .header p{
        font-size:1rem;
    }
}

</style>
</head>

<body>

<div class="snow">
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
</div>

<div class="content">

    <div id="testBanner"></div>

    <div class="header">
        <h1>🎄 Julen med Dig ❤️</h1>

        <p>
            24 små påmindelser om<br>
            hvor meget du betyder for mig
        </p>
    </div>

    <div class="hero">

        <h2>Til min elskede ❤️</h2>

        <p>
            Bag hver låge gemmer der sig et minde,
            en kærlig tanke eller en lille overraskelse.
        </p>

        <div id="countdown" class="countdown"></div>

    </div>

    <div id="calendar" class="calendar"></div>

    <div class="footer">
        Lavet med kærlighed ❤️<br>
        🎁 Tobias 🎁
    </div>

</div>

<script>

// =====================
// TESTTILSTAND
// =====================

const TEST_MODE = true;

const TEST_MONTH = 12;
const TEST_DAY = 24;

// =====================

let currentMonth;
let currentDay;

if(TEST_MODE){

    currentMonth = TEST_MONTH;
    currentDay = TEST_DAY;

    document.getElementById("testBanner")
    .innerHTML = `
        <div class="test-banner">
            🧪 TESTTILSTAND:
            ${TEST_DAY}. december
        </div>
    `;

}else{

    const cph = new Intl.DateTimeFormat(
        "en-GB",
        {
            timeZone:"Europe/Copenhagen",
            month:"numeric",
            day:"numeric"
        }
    ).formatToParts(new Date());

    currentMonth =
    Number(
        cph.find(p =>
        p.type==="month").value
    );

    currentDay =
    Number(
        cph.find(p =>
        p.type==="day").value
    );
}

const countdown =
document.getElementById("countdown");

if(currentMonth === 12){

    if(currentDay < 24){

        const daysLeft =
        24 - currentDay;

        countdown.textContent =
        `🎄 Kun ${daysLeft} dage til juleaften`;

    }else{

        countdown.textContent =
        "🎄 Glædelig jul ❤️";
    }
}

const calendar =
document.getElementById("calendar");

for(
    let day = 1;
    day <= Math.min(currentDay,24);
    day++
){

    const door =
    document.createElement("a");

    door.href =
    `day${day}.html`;

    door.className =
    "door";

    door.innerHTML = `
        <div class="day">
            ${day}
        </div>

        <div class="icon">
            🎁
        </div>
    `;

    calendar.appendChild(door);
}

</script>

</body>
</html>
