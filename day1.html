    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    max-width:600px;
    margin:20px;
    background:rgba(255,255,255,0.12);

    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.date{
    font-size:1.2rem;
    opacity:0.9;
}

    font-size:3rem;
    margin:10px 0;
}

.message{
    font-size:1.3rem;
    line-height:1.8;
    margin-top:30px;
}

.heart{
    font-size:4rem;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0% {transform:scale(1);}
    50% {transform:scale(1.15);}
    100% {transform:scale(1);}
}

.signature{
    margin-top:30px;
    font-style:italic;
    opacity:0.9;
}
</style>
