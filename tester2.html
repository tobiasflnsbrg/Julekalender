<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julen med Dig ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            font-family: Georgia, serif;
            color: white;
            background: radial-gradient(circle at top, #c62828 0%, #790000 50%, #250000 100%);
        }

        .snow {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .snowflake {
            position: absolute;
            top: -40px;
            color: white;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        .snowflake:nth-child(1) { left: 5%; font-size: 20px; animation-duration: 10s; }
        .snowflake:nth-child(2) { left: 18%; font-size: 14px; animation-duration: 13s; animation-delay: -4s; }
        .snowflake:nth-child(3) { left: 32%; font-size: 24px; animation-duration: 12s; animation-delay: -7s; }
        .snowflake:nth-child(4) { left: 48%; font-size: 16px; animation-duration: 9s; animation-delay: -2s; }
        .snowflake:nth-child(5) { left: 63%; font-size: 22px; animation-duration: 14s; animation-delay: -8s; }
        .snowflake:nth-child(6) { left: 77%; font-size: 15px; animation-duration: 11s; animation-delay: -5s; }
        .snowflake:nth-child(7) { left: 91%; font-size: 25px; animation-duration: 13s; animation-delay: -10s; }

        @keyframes fall {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: auto;
        }

        .lights {
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.8rem);
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffe082;
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin: 10px 0;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.4);
        }

        .header p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .hero {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 30px;
            padding: 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .hero h2 {
            color: #ffe082;
            margin-top: 0;
        }

        .hero p {
            line-height: 1.7;
        }

        .countdown {
            color: #ffe082;
            font-weight: bold;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .door {
            min-height: 120px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--rotation, 0deg));
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .door:hover {
            transform: translate(var(--x, 0px), calc(var(--y, 0px) - 5px)) rotate(var(--rotation, 0deg));
        }

        .door:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        .unlocked {
            color: white;
            background: linear-gradient(145deg, #e53935, #a50000);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }

        .unlocked:hover {
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.45);
        }

        .locked {
            color: #eee;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .day {
            font-size: 2rem;
            font-weight: bold;
        }

        .icon {
            font-size: 1.5rem;
        }

        .footer {
            margin: 40px 0 10px;
            text-align: center;
            color: #ffe082;
            line-height: 1.8;
        }

        @media (prefers-reduced-motion: reduce) {
            .snowflake { animation: none; }
            .door { transition: none; }
        }
    </style>
</head>

<body>
    <div class="snow" aria-hidden="true">
        <span class="snowflake">❄</span>
        <span class="snowflake">❅</span>
        <span class="snowflake">❆</span>
        <span class="snowflake">❄</span>
        <span class="snowflake">❅</span>
        <span class="snowflake">❆</span>
        <span class="snowflake">❄</span>
    </div>

    <main class="content">
        <div class="lights" aria-hidden="true">✨ 🔴 🟡 🟢 🔴 🟡 🟢 ✨</div>

        <header class="header">
            <h1>🎄 Julen med Dig ❤️</h1>
            <p>
                24 små påmindelser om,<br>
                hvor meget du betyder for mig
            </p>
        </header>

        <section class="hero">
            <h2>Til min elskede ❤️</h2>
            <p>
                Bag hver låge gemmer der sig<br>
                et minde, en kærlig tanke<br>
                eller en lille overraskelse.
            </p>
            <p class="countdown" id="countdown"></p>
        </section>

        <section id="calendar" class="calendar" aria-label="Julekalender"></section>

        <noscript>
            <p>Slå JavaScript til i din browser for at se julekalenderen.</p>
        </noscript>

        <footer class="footer">
            Lavet med kærlighed ❤️<br>
            🎁 Tobias 🎁
        </footer>
    </main>

    <script>
        // Find dagens dato i København.
        const dateParts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Copenhagen",
            month: "numeric",
            day: "numeric"
        }).formatToParts(new Date());

        function getDatePart(type) {
            return Number(dateParts.find(part => part.type === type).value);
        }

        const currentMonth = getDatePart("month");
        const currentDay = getDatePart("day");
        const calendar = document.getElementById("calendar");
        const countdown = document.getElementById("countdown");

        if (currentMonth === 12 && currentDay < 24) {
            const daysLeft = 24 - currentDay;
            countdown.textContent = "🎄 Kun " + daysLeft + (daysLeft === 1 ? " dag" : " dage") + " til juleaften!";
        } else if (currentMonth === 12 && currentDay === 24) {
            countdown.textContent = "🎄 Glædelig juleaften! ❤️";
        } else if (currentMonth === 12) {
            countdown.textContent = "✨ Glædelig jul! ✨";
        } else {
            countdown.textContent = "✨ Julemagi er på vej ✨";
        }

        // Bland tallene 1–24, så rækkefølgen ændrer sig ved hver genindlæsning.
        const days = Array.from({ length: 24 }, (_, index) => index + 1);
        for (let i = days.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [days[i], days[j]] = [days[j], days[i]];
        }

        for (const day of days) {
            const unlocked = currentMonth === 12 && currentDay >= day;
            const door = document.createElement(unlocked ? "a" : "button");

            // Giv hver låge en lille tilfældig forskydning og hældning.
            const randomX = Math.floor(Math.random() * 11) - 5;
            const randomY = Math.floor(Math.random() * 11) - 5;
            const randomRotation = Math.floor(Math.random() * 9) - 4;
            door.style.setProperty("--x", randomX + "px");
            door.style.setProperty("--y", randomY + "px");
            door.style.setProperty("--rotation", randomRotation + "deg");

            door.className = unlocked ? "door unlocked" : "door locked";
            door.setAttribute("aria-label", unlocked ? "Åbn låge " + day : "Låge " + day + " er låst");

            if (unlocked) {
                door.href = "day" + day + ".html";
            } else {
                door.type = "button";
                door.addEventListener("click", function () {
                    alert("Denne låge åbner først den " + day + ". december ❤️");
                });
            }

            door.innerHTML =
                '<span class="day">' + day + '</span>' +
                '<span class="icon" aria-hidden="true">' + (unlocked ? '🎁' : '🔒') + '</span>';

            calendar.appendChild(door);
        }
    </script>
</body>
</html>
