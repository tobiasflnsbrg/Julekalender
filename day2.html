<script>

function openImage() {
    document
        .getElementById("lightbox")
        .style.display = "flex";
}

function closeImage() {
    document
        .getElementById("lightbox")
        .style.display = "none";
}

document.getElementById("content").innerHTML = `

<div class="card">

    <div class="heart">❤️</div>

    <div class="subtitle">
        🎄 Julen med Dig 🎄
    </div>

    <h1>2. december</h1>

    <img
        src="images/IMG_20190713_203913.jpg"
        alt="Et særligt minde"
        class="photo"
        onclick="openImage()">

    <div class="photo-text">
        📸 Tryk på billedet for at se det i fuld størrelse
    </div>

    <div class="message">

        Når jeg ser dette billede,
        bliver jeg mindet om,
        hvor mange gode minder vi allerede har skabt sammen.

        <br><br>

        Noget af det jeg beundrer mest ved dig,
        er den styrke og varme,
        du møder livet med.

        <br><br>

        Du gør vores hverdag bedre,
        vores hjem hyggeligere
        og mit liv rigere.

        <br><br>

        Jeg glæder mig til alle de minder,
        vi endnu ikke har skabt.

    </div>

    <div class="signature">
        Jeg elsker dig ❤️<br>
        Tobias
    </div>

    <div class="footer-icons">
        🎄 ❤️ 🎁 ❤️ 🎄
    </div>

</div>
`;

document.getElementById("lightbox")
.addEventListener("click", function(e) {

    if (e.target === this) {
        closeImage();
    }

});

</script>
