<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2. december ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia, serif;
    color:white;
    text-align:center;
    padding:20px;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top,
    #b71c1c 0%,
    #7f0000 45%,
    #3e0000 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    radial-gradient(white 2px, transparent 2px),
    radial-gradient(white 1px, transparent 1px);

    background-size:
    120px 120px,
    80px 80px;

    opacity:.25;

    animation:snow 20s linear infinite;

    pointer-events:none;
}

.card{

    max-width:800px;
    width:100%;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(10px);

    border:2px solid rgba(255,215,0,.35);

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 0 20px rgba(255,215,0,.15),
    0 10px 40px rgba(0,0,0,.4);

    position:relative;
}

.card::before{
    content:"🎄";
    position:absolute;
    left:25px;
    top:20px;
    font-size:2rem;
}

.card::after{
    content:"🎄";
    position:absolute;
    right:25px;
    top:20px;
    font-size:2rem;
}

h1{
    color:#ffe082;
    margin-bottom:15px;
}

.subtitle{
    color:#ffe082;
    margin-bottom:25px;
}

.heart{
    font-size:4rem;
    animation:pulse 2s infinite;
}

.lock{
    font-size:5rem;
}

.photo{
    max-width:320px;
    width:100%;

    border-radius:20px;

    border:4px solid rgba(255,215,0,.4);

    margin:20px 0;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 0 20px rgba(255,215,0,.3);
}

.photo:hover{
    transform:scale(1.03);
}

.photo-text{
    font-size:.9rem;
    opacity:.8;
    color:#ffe082;
}

.message{
    font-size:1.25rem;
    line-height:1.9;
    margin-top:20px;
}

.signature{
    margin-top:30px;
    font-style:italic;
    color:#ffe082;
}

.countdown{
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,215,0,.10);
    border:1px solid rgba(255,215,0,.3);
}

.footer-icons{
    margin-top:30px;
    font-size:1.4rem;
    letter-spacing:8px;
}
