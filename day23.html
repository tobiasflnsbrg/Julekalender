<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🟨DAGENS_DATO🟨 ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    font-family:Georgia, serif;
    text-align:center;

    color:white;

    background:
    radial-gradient(circle at top,
    #c62828 0%,
    #8b0000 50%,
    #3e0000 100%);
}

.card{

    width:100%;
    max-width:800px;

    background:
    rgba(255,255,255,0.10);

    border:2px solid rgba(255,215,0,.35);

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 0 20px rgba(255,215,0,.15),
    0 10px 40px rgba(0,0,0,.3);
}

.back-button{

    display:inline-block;

    margin-bottom:25px;

    padding:12px 20px;

    text-decoration:none;

    color:#ffe082;

    border:1px solid rgba(255,215,0,.4);

    border-radius:15px;

    background:rgba(255,215,0,.15);
}

.heart{

    font-size:4rem;
}

h1{
    color:#ffe082;
}

.subtitle{

    color:#ffe082;

    margin-bottom:20px;
}

.photo{

    width:100%;
    max-width:350px;

    border-radius:20px;

    border:4px solid rgba(255,215,0,.4);

    cursor:pointer;

    box-shadow:
    0 0 20px rgba(255,215,0,.2);
}

.message{

    margin-top:30px;

    line-height:1.9;

    font-size:1.2rem;
}

.signature{

    margin-top:30px;

    color:#ffe082;

    font-style:italic;
}

.footer{

    margin-top:30px;

    font-size:1.4rem;
}

.lightbox{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.lightbox img{

    max-width:95%;
    max-height:95vh;

    border-radius:10px;
}

.close{

    position:absolute;

    top:20px;
    right:30px;

    font-size:2rem;

    cursor:pointer;

    color:white;
}

</style>

</head>

<body>

<div class="card">

    <a href="index.html" class="back-button">
        ⬅ Tilbage til julekalenderen
    </a>

    <div class="heart">❤️</div>

    <div class="subtitle">
        🎄 Julen med Dig 🎄
    </div>

    <h1>
        🟨DAGENS_DATO🟨
    </h1>

    <img
        src="🟨BILLEDFILNAVN.jpg🟨"
        alt="Minde"
        class="photo"
        onclick="openImage()">

    <div class="message">

        🟨DAGENS_BESKED🟨

    </div>

    <div class="signature">
        Kærlig hilsen ❤️<br>
        Tobias
    </div>

    <div class="footer">
        🎄 ❤️ 🎁 ❤️ 🎄
    </div>

</div>

<div id="lightbox" class="lightbox">

    <span class="close" onclick="closeImage()">
        ✕
    </span>

    <img
        src="🟨BILLEDFILNAVN.jpg🟨"
        alt="Fuld størrelse">

</div>

<script>

function openImage() {
    document.getElementById(
        "lightbox"
    ).style.display = "flex";
}

function closeImage() {
    document.getElementById(
        "lightbox"
    ).style.display = "none";
}

document.getElementById("lightbox")
.addEventListener("click", function(e){

    if(e.target === this){
        closeImage();
    }

});

</script>

</body>
</html>
