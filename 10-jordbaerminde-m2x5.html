<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>10. december ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Georgia,serif;text-align:center;color:white;background:radial-gradient(circle at top,#c62828 0%,#8b0000 50%,#3e0000 100%)}.card{width:100%;max-width:800px;background:rgba(255,255,255,.10);border:2px solid rgba(255,215,0,.35);border-radius:30px;padding:40px}.back-button{display:inline-block;margin-bottom:25px;padding:12px 20px;text-decoration:none;color:#ffe082;border:1px solid rgba(255,215,0,.4);border-radius:15px;background:rgba(255,215,0,.15)}.photo{width:100%;max-width:350px;border-radius:20px;border:4px solid rgba(255,215,0,.4)}.message{margin-top:30px;line-height:1.9;font-size:1.2rem}</style></head><body><div class="card"><a href="index.html" class="back-button">⬅ Tilbage til julekalenderen</a><h1>10. december</h1><img src="images/20260524_205828.jpg" class="photo" onclick="openImage()"><div class="message"><h2>Fem børn og et hjem fyldt med papirfly</h2>Et hjem fyldt med grin, fem fantastiske børn og en kvinde, der får det hele til at hænge sammen.<br><br>Nogle gange styrter papirflyene til jorden, men ligesom vores familie bliver de sendt afsted igen. ❤️</div></div><div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);justify-content:center;align-items:center"><img src="images/20260524_205828.jpg" style="max-width:95%;max-height:95vh"></div><script>function openImage(){document.getElementById('lightbox').style.display='flex'}document.getElementById('lightbox').onclick=function(){this.style.display='none'}</script></body></html>
